<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="300">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @font-face {
      font-family: 'Fira Code', monospace;
    }
    .term-title { font: 600 13px 'Fira Code', monospace; fill: #8b949e; }
    .code-prompt { font: 600 14px 'Fira Code', monospace; fill: #00f2fe; }
    .code-key { font: 500 13.5px 'Fira Code', monospace; fill: #79c0ff; }
    .code-val { font: 500 13.5px 'Fira Code', monospace; fill: #a5d6ff; }
    .code-green { font: 500 13.5px 'Fira Code', monospace; fill: #7ee787; }
    .code-symbol { font: 500 13.5px 'Fira Code', monospace; fill: #e34f26; }

    /* Typewriter animation line by line */
    @keyframes typeLine1 { 0%, 0% { width: 0; } 15%, 100% { width: 320px; } }
    @keyframes typeLine2 { 0%, 15% { width: 0; } 30%, 100% { width: 480px; } }
    @keyframes typeLine3 { 0%, 30% { width: 0; } 50%, 100% { width: 440px; } }
    @keyframes typeLine4 { 0%, 50% { width: 0; } 70%, 100% { width: 510px; } }
    @keyframes typeLine5 { 0%, 70% { width: 0; } 85%, 100% { width: 420px; } }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes floatDev { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes handType { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
    @keyframes ideaFloat { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-8px) scale(1.05); } }

    .line-container { overflow: hidden; white-space: nowrap; display: inline-block; }
    .l1 { animation: typeLine1 10s steps(30, end) infinite; }
    .l2 { animation: typeLine2 10s steps(40, end) infinite; }
    .l3 { animation: typeLine3 10s steps(35, end) infinite; }
    .l4 { animation: typeLine4 10s steps(45, end) infinite; }
    .l5 { animation: typeLine5 10s steps(35, end) infinite; }

    .cursor { animation: blink 0.8s infinite; fill: #00f2fe; }
    .dev-avatar { animation: floatDev 4s ease-in-out infinite; }
    .dev-hands { animation: handType 0.3s ease-in-out infinite; }
    .idea-badge { animation: ideaFloat 3s ease-in-out infinite; }
  </style>

  <!-- Main Terminal Outer Box -->
  <rect x="10" y="10" width="860" height="280" rx="12" fill="url(#termBg)" stroke="#30363d" stroke-width="1.5" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.5))" />

  <!-- Terminal Header Bar -->
  <path d="M 10 22 C 10 15, 15 10, 22 10 L 868 10 C 875 10, 880 15, 880 22 L 880 45 L 10 45 Z" fill="#161b22" stroke="#30363d" stroke-width="1" />
  
  <!-- Window Control Buttons -->
  <circle cx="32" cy="27" r="6" fill="#ff5f56" />
  <circle cx="52" cy="27" r="6" fill="#ffbd2e" />
  <circle cx="72" cy="27" r="6" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="440" y="32" text-anchor="middle" class="term-title">ashwin@devops-control-plane:~ (zsh)</text>

  <!-- Prompt Command Line -->
  <text x="30" y="70" class="code-prompt">ashwin@devops-control-plane:~$ <tspan fill="#ffffff">cat about_me.json</tspan></text>
  <text x="30" y="92" class="code-val">{</text>

  <!-- Animated Typing Lines -->
  <g transform="translate(45, 115)">
    <!-- Line 1: Name -->
    <g class="line-container l1">
      <text class="code-key">"name"<tspan class="code-val">: </tspan><tspan class="code-green">"Ashwin Shetty"</tspan><tspan class="code-val">,</tspan></text>
    </g>
  </g>

  <g transform="translate(45, 140)">
    <!-- Line 2: Role -->
    <g class="line-container l2">
      <text class="code-key">"role"<tspan class="code-val">: </tspan><tspan class="code-green">"DevOps &amp; Infrastructure Engineer"</tspan><tspan class="code-val">,</tspan></text>
    </g>
  </g>

  <g transform="translate(45, 165)">
    <!-- Line 3: Focus -->
    <g class="line-container l3">
      <text class="code-key">"cloud_focus"<tspan class="code-val">: [</tspan><tspan class="code-green">"AWS"</tspan><tspan class="code-val">, </tspan><tspan class="code-green">"K8s"</tspan><tspan class="code-val">, </tspan><tspan class="code-green">"Terraform"</tspan><tspan class="code-val">],</tspan></text>
    </g>
  </g>

  <g transform="translate(45, 190)">
    <!-- Line 4: Philosophy -->
    <g class="line-container l4">
      <text class="code-key">"philosophy"<tspan class="code-val">: </tspan><tspan class="code-green">"Automate everything, deploy smoothly."</tspan><tspan class="code-val">,</tspan></text>
    </g>
  </g>

  <g transform="translate(45, 215)">
    <!-- Line 5: Status -->
    <g class="line-container l5">
      <text class="code-key">"status"<tspan class="code-val">: </tspan><tspan class="code-green">"Ready for high-impact roles 🟢"</tspan></text>
    </g>
  </g>

  <text x="30" y="240" class="code-val">}</text>
  <rect x="42" y="228" width="8" height="15" class="cursor" />

  <!-- RIGHT SIDE: ANIMATED DEVELOPER BOY WORKSTATION -->
  <g transform="translate(620, 45)" class="dev-avatar">
    <!-- Glowing Desk Desk Line -->
    <rect x="0" y="195" width="220" height="6" rx="3" fill="#30363d" />

    <!-- Laptop Container & Glow Screen -->
    <path d="M 45 140 L 135 140 L 145 195 L 35 195 Z" fill="#161b22" stroke="#00f2fe" stroke-width="1.5" />
    <polygon points="50,145 130,145 138,190 42,190" fill="#0d1117" opacity="0.9" />
    <!-- Screen Code Lines Glow -->
    <line x1="55" y1="155" x2="115" y2="155" stroke="#00f2fe" stroke-width="2" opacity="0.8" />
    <line x1="55" y1="165" x2="100" y2="165" stroke="#79c0ff" stroke-width="2" opacity="0.7" />
    <line x1="55" y1="175" x2="125" y2="175" stroke="#7ee787" stroke-width="2" opacity="0.9" />

    <!-- Laptop Base -->
    <rect x="25" y="193" width="130" height="6" rx="2" fill="#8b949e" />

    <!-- Coder Boy Avatar -->
    <!-- Head & Hair -->
    <circle cx="140" cy="85" r="28" fill="#ffdbac" />
    <path d="M 115 80 C 115 55, 165 55, 165 80 C 160 65, 120 65, 115 80 Z" fill="#4a2c11" />
    <!-- Glasses -->
    <circle cx="130" cy="85" r="7" fill="none" stroke="#0d1117" stroke-width="2" />
    <circle cx="146" cy="85" r="7" fill="none" stroke="#0d1117" stroke-width="2" />
    <line x1="137" y1="85" x2="139" y2="85" stroke="#0d1117" stroke-width="2" />
    <!-- Headphones -->
    <path d="M 110 85 A 32 32 0 0 1 170 85" fill="none" stroke="#00f2fe" stroke-width="4" filter="url(#glow)" />
    <rect x="108" y="78" width="6" height="16" rx="3" fill="#00f2fe" />
    <rect x="166" y="78" width="6" height="16" rx="3" fill="#00f2fe" />

    <!-- Body & Hoodie -->
    <path d="M 105 115 C 105 115, 140 108, 175 115 L 185 195 L 95 195 Z" fill="#1f6feb" />

    <!-- Animated Typing Hands -->
    <g class="dev-hands">
      <ellipse cx="80" cy="188" rx="8" ry="4" fill="#ffdbac" />
      <ellipse cx="95" cy="186" rx="8" ry="4" fill="#ffdbac" />
    </g>

    <!-- Floating Idea Tech Badges -->
    <g class="idea-badge">
      <rect x="15" y="40" width="50" height="22" rx="6" fill="#161b22" stroke="#ff9900" stroke-width="1" />
      <text x="40" y="55" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#ff9900">AWS</text>

      <rect x="150" y="25" width="50" height="22" rx="6" fill="#161b22" stroke="#326ce5" stroke-width="1" />
      <text x="175" y="40" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#326ce5">K8s</text>

      <rect x="90" y="10" width="55" height="22" rx="6" fill="#161b22" stroke="#2496ed" stroke-width="1" />
      <text x="117" y="25" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#2496ed">Docker</text>
    </g>
  </g>
</svg>
