<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" height="300">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes typeLine1 { 0%,5% { opacity:0; } 10%,100% { opacity:1; } }
    @keyframes typeLine2 { 0%,15% { opacity:0; } 22%,100% { opacity:1; } }
    @keyframes typeLine3 { 0%,28% { opacity:0; } 36%,100% { opacity:1; } }
    @keyframes typeLine4 { 0%,42% { opacity:0; } 50%,100% { opacity:1; } }
    @keyframes typeLine5 { 0%,55% { opacity:0; } 64%,100% { opacity:1; } }
    @keyframes typeLine6 { 0%,68% { opacity:0; } 78%,100% { opacity:1; } }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

    .l1 { animation: typeLine1 12s ease infinite; }
    .l2 { animation: typeLine2 12s ease infinite; }
    .l3 { animation: typeLine3 12s ease infinite; }
    .l4 { animation: typeLine4 12s ease infinite; }
    .l5 { animation: typeLine5 12s ease infinite; }
    .l6 { animation: typeLine6 12s ease infinite; }
    .cursor { animation: blink 0.7s step-end infinite; }
  </style>

  <!-- ===== OUTER FRAME ===== -->
  <rect x="0" y="0" width="520" height="300" rx="14" fill="url(#termBg)" stroke="#30363d" stroke-width="1" />

  <!-- ===== TERMINAL HEADER BAR ===== -->
  <rect x="0" y="0" width="520" height="38" rx="14" fill="#1c2128" />
  <rect x="0" y="24" width="520" height="14" fill="#1c2128" />
  <circle cx="22" cy="19" r="6.5" fill="#ff5f57" />
  <circle cx="42" cy="19" r="6.5" fill="#febc2e" />
  <circle cx="62" cy="19" r="6.5" fill="#28c840" />
  <text x="260" y="24" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#8b949e" font-weight="600">ashwin@devops ~ zsh — 80×24</text>

  <!-- ===== TERMINAL CODE ===== -->

  <!-- Prompt line -->
  <text x="24" y="66" font-family="'SF Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#00f2fe">❯</text>
  <text x="40" y="66" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#e6edf3">cat about_me.json</text>

  <!-- Opening brace -->
  <text x="24" y="90" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#e6edf3">{</text>

  <!-- Line 1 -->
  <g class="l1">
    <text x="44" y="112" font-family="'SF Mono','Fira Code',monospace" font-size="13">
      <tspan fill="#79c0ff">"name"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"Ashwin Shetty"</tspan><tspan fill="#e6edf3">,</tspan>
    </text>
  </g>

  <!-- Line 2 -->
  <g class="l2">
    <text x="44" y="134" font-family="'SF Mono','Fira Code',monospace" font-size="13">
      <tspan fill="#79c0ff">"role"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"DevOps &amp; Cloud Engineer"</tspan><tspan fill="#e6edf3">,</tspan>
    </text>
  </g>

  <!-- Line 3 -->
  <g class="l3">
    <text x="44" y="156" font-family="'SF Mono','Fira Code',monospace" font-size="13">
      <tspan fill="#79c0ff">"stack"</tspan><tspan fill="#e6edf3">: [</tspan><tspan fill="#a5d6ff">"AWS"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">"K8s"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">"Terraform"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">"Docker"</tspan><tspan fill="#e6edf3">],</tspan>
    </text>
  </g>

  <!-- Line 4 -->
  <g class="l4">
    <text x="44" y="178" font-family="'SF Mono','Fira Code',monospace" font-size="13">
      <tspan fill="#79c0ff">"cicd"</tspan><tspan fill="#e6edf3">: [</tspan><tspan fill="#a5d6ff">"Jenkins"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">"GitHub Actions"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">"GitLab CI"</tspan><tspan fill="#e6edf3">],</tspan>
    </text>
  </g>

  <!-- Line 5 -->
  <g class="l5">
    <text x="44" y="200" font-family="'SF Mono','Fira Code',monospace" font-size="13">
      <tspan fill="#79c0ff">"motto"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"Automate everything, ship fast"</tspan><tspan fill="#e6edf3">,</tspan>
    </text>
  </g>

  <!-- Line 6 -->
  <g class="l6">
    <text x="44" y="222" font-family="'SF Mono','Fira Code',monospace" font-size="13">
      <tspan fill="#79c0ff">"status"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#7ee787">"Open to opportunities"</tspan>
    </text>
    <!-- Green dot -->
    <circle cx="328" cy="218" r="4" fill="#3fb950" filter="url(#glow)" />
  </g>

  <!-- Closing brace -->
  <g class="l6">
    <text x="24" y="244" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#e6edf3">}</text>
  </g>

  <!-- Blinking cursor -->
  <rect x="34" y="233" width="8" height="16" rx="1" fill="#00f2fe" class="cursor" />

  <!-- Next prompt -->
  <g class="l6">
    <text x="24" y="270" font-family="'SF Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#00f2fe">❯</text>
    <rect x="40" y="258" width="8" height="16" rx="1" fill="#00f2fe" class="cursor" />
  </g>
</svg>
