<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="120">
  <defs>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <style>
    @keyframes fall1 {
      0% { transform: translateY(-10px) translateX(0px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.8; }
      100% { transform: translateY(130px) translateX(15px); opacity: 0; }
    }
    @keyframes fall2 {
      0% { transform: translateY(-10px) translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 0.9; }
      100% { transform: translateY(130px) translateX(-20px); opacity: 0; }
    }
    @keyframes fall3 {
      0% { transform: translateY(-10px) translateX(0px); opacity: 0; }
      25% { opacity: 0.8; }
      75% { opacity: 0.7; }
      100% { transform: translateY(130px) translateX(10px); opacity: 0; }
    }

    .snow-cyan { fill: #00f2fe; filter: drop-shadow(0 0 3px #00f2fe); }
    .snow-white { fill: #ffffff; filter: drop-shadow(0 0 2px #ffffff); }
    .snow-blue { fill: #79c0ff; filter: drop-shadow(0 0 2px #79c0ff); }

    /* Animation classes with varied delays and speeds for natural slow snowfall */
    .s1 { animation: fall1 7s linear infinite; }
    .s2 { animation: fall2 9s linear infinite 1.2s; }
    .s3 { animation: fall3 11s linear infinite 2.5s; }
    .s4 { animation: fall1 8s linear infinite 3.8s; }
    .s5 { animation: fall2 10s linear infinite 0.5s; }
    .s6 { animation: fall3 12s linear infinite 4.2s; }
    .s7 { animation: fall1 6.5s linear infinite 2.0s; }
    .s8 { animation: fall2 8.5s linear infinite 3.1s; }
  </style>

  <rect width="1200" height="120" fill="url(#snowGrad)" rx="8" />

  <!-- Snowflakes layer 1 (Cyan Glow) -->
  <circle cx="50" cy="0" r="3" class="snow-cyan s1" />
  <circle cx="180" cy="0" r="2" class="snow-cyan s3" />
  <circle cx="320" cy="0" r="3.5" class="snow-cyan s5" />
  <circle cx="480" cy="0" r="2.5" class="snow-cyan s2" />
  <circle cx="620" cy="0" r="3" class="snow-cyan s7" />
  <circle cx="780" cy="0" r="2" class="snow-cyan s4" />
  <circle cx="920" cy="0" r="3.5" class="snow-cyan s8" />
  <circle cx="1080" cy="0" r="2.5" class="snow-cyan s6" />

  <!-- Snowflakes layer 2 (Pure White) -->
  <circle cx="100" cy="0" r="2.5" class="snow-white s2" />
  <circle cx="240" cy="0" r="3.5" class="snow-white s4" />
  <circle cx="390" cy="0" r="2" class="snow-white s6" />
  <circle cx="540" cy="0" r="3" class="snow-white s8" />
  <circle cx="700" cy="0" r="2.5" class="snow-white s1" />
  <circle cx="850" cy="0" r="3.5" class="snow-white s3" />
  <circle cx="1000" cy="0" r="2" class="snow-white s5" />
  <circle cx="1140" cy="0" r="3" class="snow-white s7" />

  <!-- Snowflakes layer 3 (Soft Blue Sparkles) -->
  <circle cx="30" cy="0" r="2" class="snow-blue s6" />
  <circle cx="140" cy="0" r="3" class="snow-blue s8" />
  <circle cx="280" cy="0" r="2.5" class="snow-blue s1" />
  <circle cx="430" cy="0" r="3.5" class="snow-blue s3" />
  <circle cx="590" cy="0" r="2" class="snow-blue s5" />
  <circle cx="740" cy="0" r="3" class="snow-blue s7" />
  <circle cx="890" cy="0" r="2.5" class="snow-blue s2" />
  <circle cx="1040" cy="0" r="3.5" class="snow-blue s4" />
</svg>
